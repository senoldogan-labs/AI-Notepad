# Sitenin yayını (Cloudflare Pages, doğrudan yükleme; proje `ainotepad`, üretim dalı `main`):
# - main'e web/ ya da bu dosyada değişiklik gelince (yönetim panelinden kaydedilen blog yazıları da main'e
#   `blog/<kısa ad>-<zaman>` pull request'iyle, zorunlu denetimler geçince otomatik birleştirmeyle girer);
# - her gün 06:00 UTC'de: zamanlanmış blog yazıları tarihleri geldiğinde yayımlansın (derleme, tarihi derleme gününden
#   sonra olan ve taslak yazıları atlar; web/src/lib/blog.ts → isBlogPostPublic);
# - elle (workflow_dispatch).
# Derleme elle yayınla aynıdır (`npm run build`, üretim yapılandırması); önünde tipler, ardında çıktı testleri çalışır
# (ci.yml → web ile aynı). Ardından her yayımlanan blog yazısının paylaşım görseli runner'ın Google Chrome'uyla
# üretilir (`npm run og:blog`, ubuntu-latest'te /usr/bin/google-chrome kurulu gelir).
# Yükleme başarılı olunca yeni ve değişen blog yazıları IndexNow'a bildirilir (`npm run indexnow`; bildirim hatası yayını
# geri almaz, iş kırmızı görünür). Gizli değerler: CLOUDFLARE_API_TOKEN (yalnızca "Cloudflare Pages: Edit" yetkili API
# jetonu) ve CLOUDFLARE_ACCOUNT_ID (bkz. web/README.md). IndexNow anahtarı açıktır ve depodadır (web/src/config.ts).
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# İş yalnızca kodu okur; yayın Cloudflare jetonuyla yapılır.
permissions:
  contents: read

# Eylemler commit özetine sabittir (etiket sonradan başka koda taşınamaz; yükseltirken özeti ve yorumdaki sürümü
# birlikte güncelle); checkout GITHUB_TOKEN'ı .git/config'e yazmaz (persist-credentials: false).

# Yayınlar üst üste binmez: süren yayın biter, bekleyen en yenisi ardından çalışır.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    # `production` ortamı yalnızca main dalından çalışan işlere açıktır (depo ayarları → Environments).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Bağımlılıklar
        run: npm ci
      # PR denetimi (ci.yml → web) burada da çalışır: yönetici ya da sahip main'e korumayı atlayarak gönderebilir ve
      # zamanlanmış yayın denetlenmemiş bir commit'i de derleyebilir. Tipler ya da çıktı testleri düşerse yükleme olmaz.
      - name: Tipler
        run: npm run typecheck
      - name: Derleme
        run: npm run build
      # Derlemenin JSON-LD'si, /llms.txt, site haritası ve _headers (CSP) kuralları (scripts/check-dist.test.ts).
      - name: Çıktı testleri
        run: npm test
      # Görseller sayfaların kendi kapağından çizilir (web/scripts/make-blog-og.ts); Chrome yoksa adım açık hatayla durur.
      - name: Blog paylaşım görselleri
        run: |
          /usr/bin/google-chrome --version
          npm run og:blog -- /usr/bin/google-chrome
      # Wrangler sürümü sunucununkiyle (server/package.json) aynı tutulur: yayın aracı sessizce değişmez.
      - name: Cloudflare Pages'e yükle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.154.0 pages deploy dist --project-name ainotepad --branch main
      # Yalnızca yükleme başarılıysa çalışır (önceki adım düşerse iş durur); ayrıntı web/scripts/indexnow.ts.
      - name: IndexNow bildirimi
        run: npm run indexnow
