name: AINotepad
options:
  bundleIdPrefix: com.senoldogan
  # Tek dosya kaynakları (ör. eklentideki iOS/Shared/RecordingIntents.swift) klasör ağacındaki
  # gruplarına yerleşir; aksi halde aynı grup iki üst gruba girer ve Xcode 27 projeyi açmaz.
  createIntermediateGroups: true
  # Kaynak metinler Türkçe; İngilizce çeviriler App/Localizable.xcstrings'te.
  developmentLanguage: tr
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.1"
packages:
  AINotepadCore:
    path: Packages/AINotepadCore
  # Mac uygulamasının kendi kendini güncellemesi (yalnız macOS hedefi; iPhone uygulaması App Store/TestFlight'tan gelir).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  # iPhone uygulamasının App Store aboneliği (yalnız iOS hedefi; Mac'te ödeme Stripe'tan, çekirdek pakete girmez).
  # Sürüm tam sabitlenir: Package.resolved üretilen (repoya girmeyen) projenin içindedir.
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    exactVersion: 5.100.0
targets:
  AINotepad:
    type: application
    platform: macOS
    sources:
      # App/Licenses (WhisperKit/SpeakerKit MIT lisansı ve bildirimleri, Sparkle'ın lisansı) ve App/Fonts/Inter-OFL.txt da
      # kaynaklarla gelir.
      # App/Hosted yalnızca abonelik sürümünündür (AINotepadHosted).
      - path: App
        excludes: ["Hosted/**"]
      # Üçüncü taraf bildirimi uygulamanın içinde de (Resources/NOTICE).
      - path: NOTICE
        buildPhase: resources
    dependencies:
      - package: AINotepadCore
        product: AINotepadCore
      - package: AINotepadCore
        product: AINotepadUI
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Gömülü Inter (App/Fonts; Resources köküne kopyalanır).
        ATSApplicationFontsPath: "."
        # Veri klasörü: ~/Library/Application Support/AINotepad (bkz. AppPaths.dataFolderName).
        AINotepadDataFolderName: AINotepad
        LSApplicationCategoryType: public.app-category.productivity
        NSAudioCaptureUsageDescription: "AI-Notepad toplantıdaki diğer katılımcıların sesini yazıya dökmek için sistem sesini dinler."
        NSRemindersFullAccessUsageDescription: "AI-Notepad toplantı notundaki görevleri istediğinde Anımsatıcılar'a ekler."
        NSAppleEventsUsageDescription: "AI-Notepad toplantı notunu istediğinde Apple Notlar'a yazar."
        NSCalendarsFullAccessUsageDescription: "AI-Notepad yaklaşan toplantılarını gösterir, başlamadan önce hatırlatır ve notu toplantının adıyla kaydeder."
        # Kanal girişlerinin (Slack, Discord, Teams) dönüş adresi: com.senoldogan.ainotepad://oauth/<servis>.
        CFBundleURLTypes:
          - CFBundleURLName: com.senoldogan.AINotepad.oauth
            CFBundleURLSchemes: [com.senoldogan.ainotepad]
        # Sparkle: güncelleme akışı yayın deposunun (RELEASES_REPO_AINOTEPAD) en son GitHub sürümündeki appcast.xml;
        # depo ve imza anahtarı Config/Signing.xcconfig'te. Anahtar boşsa güncelleme kapalıdır (bkz. App/AppUpdater.swift).
        # Otomatik denetim baştan açık: Sparkle ikinci açılışta izin sormaz (açılır pencere yok).
        SUFeedURL: "https://github.com/$(RELEASES_REPO_AINOTEPAD)/releases/latest/download/appcast.xml"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: true
        # 6 saatte bir denetlenir (açılıştaki ek denetim App/AppUpdater.swift'te); güncellemeler varsayılan olarak arka
        # planda indirilir (Ayarlar › Genel'den kapatılabilir) ve uygulamadaki şeritte haber verilir.
        SUScheduledCheckInterval: 21600
        SUAutomaticallyUpdate: true
        # Geri bildirim ve çökme raporlarının gittiği sunucu (`POST /v1/reports`, hesapsız); Debug ve Release aynı.
        ReportsAPIBase: "https://api.gistsmith.com"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senoldogan.AINotepad
        PRODUCT_NAME: AINotepad
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Yerelleştirilebilir metinler derlemede çıkarılır ve String Catalog'a eşlenir.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Apple noter onayı (notarization) hardened runtime ister; mikrofon yetkisi entitlements dosyasında.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/AINotepad.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: AI-Notepad
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "AI-Notepad toplantıda ve sesle yazarken söylediklerini yazıya dökmek için mikrofonu kullanır."
        MARKETING_VERSION: "0.1.12"
        CURRENT_PROJECT_VERSION: "23"
  # Abonelik sürümü: anahtarsız; yapay zekâ, son geçiş ve canlı metin jetonu (Deepgram) bizim sunucumuz (server/)
  # üzerinden. Canlı motoru her kayıt için sunucu seçer; sunucu Deepgram vermezse canlı metin Mac'te (WhisperKit), bkz.
  # App/Hosted/HostedSeams.swift.
  # Geliştirici sürümüyle aynı kaynaklar + App/Hosted; farklar yalnızca `HOSTED_EDITION` bayrağıyla birkaç noktada.
  # Ayrı paket kimliği, Anahtar Zinciri servisi ve veri klasörü: iki uygulama aynı Mac'te yan yana durur.
  # Ürün adı Gistsmith (Gistsmith.app, görünen ad, izin metinleri); iç kimlikler (paket kimliği, adres şeması, Anahtar
  # Zinciri servisi, veri klasörü, hedef adı) AINotepad olarak kalır. Arayüzdeki ad görünen addan okunur (App/AppName.swift).
  AINotepadHosted:
    type: application
    platform: macOS
    sources:
      # İzin metinleri ve görünen ad bu sürümün kendi kataloğunda (App/Hosted/InfoPlist.xcstrings, "Gistsmith").
      # App/Licenses (Sparkle'ın lisansı dahil) ve App/Fonts/Inter-OFL.txt geliştirici sürümündeki gibi kaynaklarla gelir.
      # Geliştirici sürümünün Info.plist'i (App/Info.plist) ve bu hedefin kendi Info.plist'i kaynak olarak kopyalanmaz.
      - path: App
        excludes: ["InfoPlist.xcstrings", "Info.plist", "Hosted/Info.plist"]
      - path: NOTICE
        buildPhase: resources
    dependencies:
      - package: AINotepadCore
        product: AINotepadCore
      - package: AINotepadCore
        product: AINotepadUI
      - package: Sparkle
    info:
      path: App/Hosted/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ATSApplicationFontsPath: "."
        # Kaynak metinler Türkçe olsa da geliştirme bölgesi İngilizce: sistem dili ne Türkçe ne İngilizce olan
        # kullanıcı (ör. Almanca) arayüzü İngilizce görür. tr.lproj ve en.lproj ikisi de pakette.
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 T:mi Aslan Dogan Marketing"
        # Kendi veri klasörü: geliştirici sürümünün ~/Library/Application Support/AINotepad'ine hiç dokunulmaz. Debug
        # derlemesi ayrı klasör ve Anahtar Zinciri servisi kullanır (aşağıda `configs`): yerel sunucuyla denenen
        # derleme yayındaki oturumu ve toplantıları okuyamaz, silemez.
        AINotepadDataFolderName: "$(HOSTED_DATA_FOLDER_NAME)"
        # Kullanıcı verisi (toplantılar, Sor geçmişi, kişiler, ses izleri) giriş yapan hesaba göre ayrı klasörde:
        # `<veri klasörü>/Accounts/<anahtar>` (bkz. Packages/AINotepadCore/.../Support/AccountData.swift).
        AINotepadAccountScopedData: true
        HostedKeychainService: "$(HOSTED_KEYCHAIN_SERVICE)"
        NSAudioCaptureUsageDescription: "Gistsmith toplantıdaki diğer katılımcıların sesini yazıya dökmek için sistem sesini dinler."
        NSRemindersFullAccessUsageDescription: "Gistsmith toplantı notundaki görevleri istediğinde Anımsatıcılar'a ekler."
        NSAppleEventsUsageDescription: "Gistsmith toplantı notunu istediğinde Apple Notlar'a yazar."
        NSCalendarsFullAccessUsageDescription: "Gistsmith yaklaşan toplantılarını gösterir, başlamadan önce hatırlatır ve notu toplantının adıyla kaydeder."
        # Sparkle: kendi akışı (yalnızca sürümleri taşıyan RELEASES_REPO_GISTSMITH deposu) ve kendi imza anahtarı
        # (SPARKLE_PUBLIC_KEY_GISTSMITH, hesap "gistsmith"); ikisi de Config/Signing.xcconfig'te. Geliştirici akışı bu
        # uygulamaya geliştirici DMG'sini kurardı, bu yüzden paylaşılmaz. Yayın: scripts/release-gistsmith.sh.
        SUFeedURL: "https://github.com/$(RELEASES_REPO_GISTSMITH)/releases/latest/download/appcast.xml"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY_GISTSMITH)"
        SUEnableAutomaticChecks: true
        # 6 saatte bir denetlenir (açılıştaki ek denetim App/AppUpdater.swift'te); güncellemeler varsayılan olarak arka
        # planda indirilir (Ayarlar › Genel'den kapatılabilir) ve uygulamadaki şeritte haber verilir.
        SUScheduledCheckInterval: 21600
        SUAutomaticallyUpdate: true
        # Adres şeması kaydı yok: giriş ASWebAuthenticationSession ile yapılır, dönüş
        # (com.senoldogan.ainotepad.hosted://auth/<apple|google>#idToken=…) Launch Services'e uğramadan doğrudan o
        # oturuma gelir (bkz. App/Hosted/HostedAccount.swift). Başka bir uygulama ya da eski bir kopya dönüşü alamaz.
        # Sunucu ve site adresleri derleme ayarlarından (aşağıda `configs`).
        HostedAPIBase: "$(HOSTED_API_BASE)"
        HostedSiteBase: "$(HOSTED_SITE_BASE)"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senoldogan.AINotepad.hosted
        # Gistsmith.app; Swift modülü hedef adıyla kalır (PRODUCT_NAME'den türemesin).
        PRODUCT_NAME: Gistsmith
        PRODUCT_MODULE_NAME: AINotepadHosted
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HOSTED_EDITION"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        # Info.plist üretimi CFBundleDevelopmentRegion'ı bu ayardan yazar (yukarıdaki `info` değerini ezer): Türkçe ve
        # İngilizce dışındaki sistem dillerinde arayüz İngilizce açılsın. Kataloglarda kaynak dil Türkçe kalır.
        DEVELOPMENT_LANGUAGE: en
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Geliştirici sürümünün yetkileri, iCloud hariç (eşitleme bu sürümde kapalı). Apple ile giriş yetkisi yok
        # (Developer ID profillerine verilmez); giriş sitede, uygulama içi giriş penceresinde (bkz.
        # Packages/AINotepadCore/Sources/AINotepadCore/Hosted/HostedBrowserSignIn.swift).
        CODE_SIGN_ENTITLEMENTS: App/Hosted/AINotepadHosted.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Gistsmith
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Gistsmith toplantıda ve sesle yazarken söylediklerini yazıya dökmek için mikrofonu kullanır."
        MARKETING_VERSION: "0.1.12"
        CURRENT_PROJECT_VERSION: "23"
      configs:
        # Yerel sunucu: `cd server && npm run dev` (http yalnızca Debug'da kabul edilir).
        Debug:
          HOSTED_API_BASE: "http://localhost:8787"
          HOSTED_SITE_BASE: "http://localhost:8788"
          HOSTED_DATA_FOLDER_NAME: "AINotepad Hosted Debug"
          HOSTED_KEYCHAIN_SERVICE: "AINotepadHosted.debug"
        # Üretim sunucusu ve sitesi. Release https dışındaki adresi reddeder. Site adresi sunucunun SITE_ORIGIN'iyle
        # aynı olmalı.
        Release:
          HOSTED_API_BASE: "https://api.gistsmith.com"
          HOSTED_SITE_BASE: "https://gistsmith.com"
          HOSTED_DATA_FOLDER_NAME: "AINotepad Hosted"
          HOSTED_KEYCHAIN_SERVICE: "AINotepadHosted"
  # iPhone uygulaması: Gistsmith (abonelik sürümü), yalnızca hesapla. Mac'teki Gistsmith'le aynı paket kimliği (Apple ile
  # girişin birincil App ID'si), aynı sunucu ve giriş akışı (App/Hosted'daki ortak dosyalar); `HOSTED_EDITION` bayrağı
  # açık. Kendi anahtarlarınla çalışma ve geliştirici sürümüyle iCloud eşitlemesi yok: toplantılar telefonda kalır.
  AINotepadiOS:
    type: application
    platform: iOS
    sources:
      # iPhone'un izin metinleri (InfoPlist.xcstrings, tr/en) ve gizlilik bildirimi (PrivacyInfo.xcprivacy) bu klasörde.
      # StoreKit yapılandırması pakete girmez: yalnızca Xcode'daki Run (şema) kullanır.
      - path: iOS
        excludes: ["Purchases/Products.storekit"]
      # Ortak metin kataloğu ve gömülü Inter yazı tipi Mac uygulamasıyla paylaşılır.
      - path: App/Localizable.xcstrings
      - path: App/Fonts/InterVariable.ttf
        buildPhase: resources
      - path: App/Fonts/Inter-OFL.txt
        buildPhase: resources
      # iPhone da WhisperKit'i bağlar; lisansı ve bildirimleri onunla gelir. Sparkle yalnızca Mac'te: lisansı burada yok.
      - path: App/Licenses
        buildPhase: resources
        excludes: ["Sparkle-LICENSE.txt"]
      - path: NOTICE
        buildPhase: resources
      # Takvim bağlantısı (EventKit) Mac'le aynı.
      - path: App/EventKitConnector.swift
      # Görünen ad (metinlerdeki ürün adı) Mac'le aynı yoldan okunur; iPhone'da "Gistsmith".
      - path: App/AppName.swift
      # Abonelik hesabı (giriş, hak durumu, toplantı oturumu, cihaz doğrulaması), sunucu bağlantı noktaları ve telemetri
      # Mac'teki Gistsmith'le ortak; platforma özgü kısımlar dosyaların içinde `os(macOS)`/`os(iOS)` ile ayrılır.
      - path: App/AppTelemetry.swift
      - path: App/Hosted/HostedAccount.swift
      - path: App/Hosted/HostedAccountScope.swift
      - path: App/Hosted/HostedDeviceAttestation.swift
      - path: App/Hosted/HostedSeams.swift
      - path: App/Hosted/HostedTelemetryCenter.swift
      - path: App/Hosted/HostedTexts.swift
    dependencies:
      - package: AINotepadCore
        product: AINotepadCore
      - package: AINotepadCore
        product: AINotepadUI
      # Canlı etkinlik, Denetim Merkezi düğmesi ve widget.
      - target: AINotepadWidgets
      # App Store aboneliği (satın alma, geri yükleme; bkz. iOS/Purchases/).
      - package: RevenueCat
        product: RevenueCat
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # Mac'teki Gistsmith'le aynı App ID (Apple ile girişin birincil App ID'si; App Store'da evrensel satın alma).
        PRODUCT_BUNDLE_IDENTIFIER: com.senoldogan.AINotepad.hosted
        # Gistsmith.app; Swift modülü hedef adıyla kalır.
        PRODUCT_NAME: Gistsmith
        PRODUCT_MODULE_NAME: AINotepadiOS
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HOSTED_EDITION"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        # Mac'teki Gistsmith gibi: sistem dili ne Türkçe ne İngilizce olan telefon arayüzü İngilizce görür (kataloglarda
        # kaynak dil Türkçe kalır).
        DEVELOPMENT_LANGUAGE: en
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Gistsmith
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Gistsmith yüz yüze toplantıyı yazıya dökmek için mikrofonu kullanır."
        # RevenueCat projesi "Gistsmith", uygulama "Gistsmith iOS"; herkese açık SDK anahtarı (tasarım gereği gizli değil).
        REVENUECAT_API_KEY: appl_ieKXerVuheTnPCIeSxTSxcEuefx
        # Yetki dosyası yok: giriş ASWebAuthenticationSession ile sitede (Apple ile giriş yetkisi gerekmez), iCloud
        # eşitlemesi bu sürümde kapalı, DeviceCheck yetki istemez.
        MARKETING_VERSION: "0.1.12"
        CURRENT_PROJECT_VERSION: "23"
      configs:
        # Mac'teki Gistsmith'in ayarlarıyla aynı. Debug yerel sunucuya bağlanır (Simülatör Mac'in ağını paylaşır;
        # `cd server && npm run dev`); gerçek iPhone'da Debug derlemesi localhost'a ulaşamaz, Release kullan.
        Debug:
          HOSTED_API_BASE: "http://localhost:8787"
          HOSTED_SITE_BASE: "http://localhost:8788"
          HOSTED_DATA_FOLDER_NAME: "AINotepad Hosted Debug"
          HOSTED_KEYCHAIN_SERVICE: "AINotepadHosted.debug"
        Release:
          HOSTED_API_BASE: "https://api.gistsmith.com"
          HOSTED_SITE_BASE: "https://gistsmith.com"
          HOSTED_DATA_FOLDER_NAME: "AINotepad Hosted"
          HOSTED_KEYCHAIN_SERVICE: "AINotepadHosted"
    # Debug çalıştırması yerel StoreKit yapılandırmasıyla: abonelik ekranı Simülatör'de App Store Connect olmadan satın
    # alır (Xcode ortamı işlemi; RevenueCat doğrulayabilsin diye panelde StoreKit test sertifikası yüklü olmalı, sunucu
    # hakkı açmaz). Yalnızca Xcode'dan Run'da geçerlidir: xcodebuild/simctl başlatması gerçek sandbox'ı kullanır (Apple
    # FB22237318). Release ve TestFlight gerçek App Store'u kullanır.
    scheme:
      storeKitConfiguration: iOS/Purchases/Products.storekit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # İhracat uyumu: yalnız işletim sisteminin standart şifrelemesi (HTTPS) kullanılır; App Store Connect her
        # derlemede bu soruyu sormaz.
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 T:mi Aslan Dogan Marketing"
        # Veri klasörü (uygulamanın kendi kabında): Application Support/<ad>; Mac'teki Gistsmith'le aynı adlar.
        AINotepadDataFolderName: "$(HOSTED_DATA_FOLDER_NAME)"
        # Kullanıcı verisi giriş yapan hesaba göre ayrı klasörde (bkz. Packages/AINotepadCore/.../Support/AccountData.swift).
        AINotepadAccountScopedData: true
        HostedKeychainService: "$(HOSTED_KEYCHAIN_SERVICE)"
        # Giriş: ASWebAuthenticationSession; dönüş (com.senoldogan.ainotepad.hosted://auth/…) adres şeması kaydı olmadan
        # doğrudan o oturuma gelir (bkz. App/Hosted/HostedAccount.swift).
        HostedAPIBase: "$(HOSTED_API_BASE)"
        HostedSiteBase: "$(HOSTED_SITE_BASE)"
        # RevenueCat'in herkese açık iOS SDK anahtarı (gizli değildir; Debug ve Release aynı, bkz. iOS/Purchases/).
        RevenueCatAPIKey: "$(REVENUECAT_API_KEY)"
        # Kayıt ekran kilitliyken ve uygulama arka plandayken sürer.
        UIBackgroundModes: [audio]
        UIAppFonts: [InterVariable.ttf]
        # Takvim yalnızca Ayarlar'da açılınca okunur (sıradaki toplantılar, kaydı süren etkinliğe bağlama).
        NSCalendarsFullAccessUsageDescription: "Gistsmith sıradaki toplantılarını gösterir ve kaydı süren toplantının adı ve katılımcılarıyla kaydeder."
        # Görev, istenince Anımsatıcılar'a eklenir (görev satırına uzun basınca).
        NSRemindersFullAccessUsageDescription: "Gistsmith toplantı notundaki görevleri istediğinde Anımsatıcılar'a ekler."
        # Kayıt kilit ekranında ve Dynamic Island'da canlı etkinlik olarak görünür.
        NSSupportsLiveActivities: true
        # Kayıttan sonra işleme uygulamadan çıkılsa da sürer (BGContinuedProcessingTask); kimlik
        # `com.senoldogan.AINotepad.hosted.process.<UUID>` biçimindedir (bkz. iOS/PhoneRecorder.swift).
        BGTaskSchedulerPermittedIdentifiers: [com.senoldogan.AINotepad.hosted.process.*]
  AINotepadWidgets:
    type: app-extension
    platform: iOS
    sources:
      - iOSWidgets
      # Canlı etkinliğin verisi ve niyetler uygulamayla ortak.
      - path: iOS/Shared/RecordingIntents.swift
      - path: App/Localizable.xcstrings
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.senoldogan.AINotepad.hosted.Widgets
        PRODUCT_NAME: AINotepadWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gistsmith
        DEVELOPMENT_LANGUAGE: en
        # Niyetlerin gövdesi eklentide boş derlenir (bkz. iOS/Shared/RecordingIntents.swift).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION HOSTED_EDITION"
        MARKETING_VERSION: "0.1.12"
        CURRENT_PROJECT_VERSION: "23"
    info:
      path: iOSWidgets/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
